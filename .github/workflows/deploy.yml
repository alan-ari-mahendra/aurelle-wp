name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/aurelle-child/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find wp-content/themes/aurelle-child -name '*.php' -print0 | xargs -0 -P4 php -l

      - name: Bash syntax check
        run: bash -n deploy/deploy.sh

      - name: Check for embedded secrets
        run: |
          if grep -rE '(AKIA|sk-|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' wp-content/themes/aurelle-child/ 2>/dev/null; then
            echo "::error::Possible secret embedded in theme files"; exit 1
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Debug SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "whoami && test -f '$REMOTE_ROOT/wp-config.php' && echo 'wp-config OK' || echo 'wp-config MISSING at '$REMOTE_ROOT"

      - name: Deploy theme
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_PORT: ${{ secrets.SITE_PORT }}
          REMOTE_ROOT: ${{ secrets.REMOTE_ROOT }}
          THEME_DIR: aurelle-child
          PROJECT: aurelle
          HEALTH_MARKER: au-page
          HEALTH_PATH: /
        run: |
          export SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          bash deploy/deploy.sh
